{% extends 'blog/base.html'%}
{%block title%}Share a Post{%endblock%}

{%block content%}
    {%if sent%}
        <h1> Email Successfully Sent</h1>
        <p>"{{post.title}}" has been shared with {{form.cleaned_data.to}}</p>
    {%else%}
        <h1>Share "{{post.title}}" by Email</h1>
        <form method="post">
            {{form.as_p}}
            {%csrf_token%}
            <input type="submit" value="Send">
        </form>
    {%endif%}

{%endblock%}
